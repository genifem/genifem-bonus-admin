name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The API client matches the committed schema
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  browser:
    # The sign-in page, plus a WCAG 2.2 AA check on every page a test reaches (NF-11). Needs
    # the API, so bonus-backend is checked out into .backend for the run.
    runs-on: ubuntu-latest
    env:
      # Build first: a cold dev server compiles routes while the tests are clicking.
      E2E_PROD: "1"
      CREWSTARS_BACKEND: ${{ github.workspace }}/.backend
      CREWSTARS_TENANT: e2e
      CS_ENV: dev
      CS_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      CS_MONGODB_DB: crew-stars-e2e
      CS_JWT_SECRET: ci-only-secret-at-least-32-characters-long
      CS_FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v5
      - name: Check out the API
        uses: actions/checkout@v5
        with:
          repository: genifem/genifem-bonus-backend
          path: .backend
          # Both repositories are private, so the job needs a token that can read the other
          # one: a fine-grained PAT with Contents:read on bonus-backend.
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
      - uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "8.0"
          mongodb-replica-set: rs0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version-file: .backend/.python-version
      # The config starts the API with `python -m uv`, so uv is installed as a module too.
      - run: python -m pip install uv
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: .backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
